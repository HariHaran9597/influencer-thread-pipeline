[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "influencer-thread-pipeline"
version = "0.1.0"
description = "Researcher -> Writer -> Fact-checker -> Editor x3 multi-agent pipeline over LangGraph, with guardrails and a measurement harness"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
